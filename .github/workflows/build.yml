name: Сборка APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Необязательно: свой ключ подписи из секретов, чтобы обновления ставились поверх.
      - name: Ключ подписи
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          SIGNING_KEYSTORE: ${{ env.HAS_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk fpmini.apk

      # Если сборка упала — выводим ошибки компилятора как аннотации (их видно без скачивания логов)
      - name: Ошибки сборки
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> .*(failed|Failed)|Execution failed" build.log \
            | grep -v "^w: " | head -40 > errors.txt || true
          i=0
          while IFS= read -r line; do
            i=$((i+1)); [ $i -gt 9 ] && break
            echo "::error::$line"
          done < errors.txt
          body=$(head -40 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=all-errors::$body"

      - uses: actions/upload-artifact@v4
        with:
          name: fpmini-apk
          path: fpmini.apk

      # Тег vX.Y.Z → релиз со скачиваемым APK
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fpmini.apk
